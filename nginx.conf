server {
  listen 80;
  server_name _;
  absolute_redirect off;
  root /usr/share/nginx/html;

  location = / {
    return 302 /cinechill-wiki/;
  }

  location = /cinechill-wiki {
    return 301 /cinechill-wiki/;
  }

  location /cinechill-wiki/ {
    try_files $uri $uri/ /cinechill-wiki/index.html;
  }

  location ~* \.(?:css|js|png|jpg|jpeg|gif|ico|svg|webp|json)$ {
    expires 30d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }
}
